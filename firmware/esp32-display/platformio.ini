; HomeLite-Bedienpanel für den ESP32 mit verschiedenen SPI-Displays.
; Je Display-Controller/Board gibt es eine eigene Umgebung (env). Bauen und flashen mit:
;   pio run -e <env> -t upload
; Verfügbare Umgebungen:
;   waveshare35  Waveshare 3.5" RPi LCD (A), ILI9486 (RPI-Variante), 320x480, Touch XPT2046   [Standard]
;   ili9341      2.2"/2.4"/2.8"/3.2" SPI-Module mit ILI9341, 240x320, Touch XPT2046
;   cyd          "Cheap Yellow Display" ESP32-2432S028R (ILI9341, eigener Touch-SPI), 240x320
;   ili9488      3.5" SPI-Module mit ILI9488 (z. B. MSP3520), 320x480, Touch XPT2046
;   ili9486      3.5" SPI-Module mit ILI9486 (nicht Waveshare-RPi), 320x480, Touch XPT2046
;   st7796       3.5"/4.0" SPI-Module mit ST7796, 320x480, Touch XPT2046
;   st7789       2.0"/2.4" SPI-Module mit ST7789, 240x320, Touch XPT2046
; Pins, Rotation, Bedienknopf: siehe README.md dieses Ordners (Build-Flags oder include/config.h).

[platformio]
default_envs = waveshare35

[env]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    knolleary/PubSubClient@^2.8

; Gemeinsame TFT_eSPI-Einstellungen. TFT_eSPI wird komplett über Build-Flags konfiguriert
; (keine Änderung an der Bibliothek nötig). Der Touch (XPT2046) hängt am selben SPI-Bus wie das Display.
[common]
flags =
    -DUSER_SETUP_LOADED=1
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT7=1
    -DSPI_TOUCH_FREQUENCY=2500000

; Standardverdrahtung für alle Module am Hauptbus (VSPI); identisch zum Waveshare-Aufbau
[pins_vspi]
flags =
    -DTFT_MISO=19
    -DTFT_MOSI=23
    -DTFT_SCLK=18
    -DTFT_CS=5
    -DTFT_DC=27
    -DTFT_RST=26
    -DTOUCH_CS=33

[env:waveshare35]
build_flags =
    ${common.flags}
    ${pins_vspi.flags}
    -DRPI_ILI9486_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DSPI_FREQUENCY=20000000
    -DSPI_READ_FREQUENCY=16000000

[env:ili9341]
build_flags =
    ${common.flags}
    ${pins_vspi.flags}
    -DILI9341_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

; ESP32-2432S028R: Display an HSPI, Touch an eigenen Pins (Software-/VSPI-Zugriff), Hintergrundlicht an GPIO21.
; Manche Varianten (mit zwei USB-Buchsen) brauchen -DILI9341_DRIVER=1 statt ILI9341_2_DRIVER und/oder -DTFT_INVERSION_ON.
[env:cyd]
lib_deps =
    ${env.lib_deps}
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git#v1.4
build_flags =
    ${common.flags}
    -DILI9341_2_DRIVER=1
    -DUSE_HSPI_PORT=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DTFT_MISO=12
    -DTFT_MOSI=13
    -DTFT_SCLK=14
    -DTFT_CS=15
    -DTFT_DC=2
    -DTFT_RST=-1
    -DTFT_BL=21
    -DSPI_FREQUENCY=55000000
    -DSPI_READ_FREQUENCY=20000000
    -DTOUCH_RAW=1
    -DTOUCH_RAW_CLK=25
    -DTOUCH_RAW_MISO=39
    -DTOUCH_RAW_MOSI=32
    -DTOUCH_RAW_CS=33

[env:ili9488]
build_flags =
    ${common.flags}
    ${pins_vspi.flags}
    -DILI9488_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000

[env:ili9486]
build_flags =
    ${common.flags}
    ${pins_vspi.flags}
    -DILI9486_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DSPI_FREQUENCY=27000000
    -DSPI_READ_FREQUENCY=16000000

[env:st7796]
build_flags =
    ${common.flags}
    ${pins_vspi.flags}
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000

[env:st7789]
build_flags =
    ${common.flags}
    ${pins_vspi.flags}
    -DST7789_DRIVER=1
    -DTFT_WIDTH=240
    -DTFT_HEIGHT=320
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
